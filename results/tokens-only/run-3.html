<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantline deal card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Excerpt of Wefunder's existing tokens (names and values from the live stylesheet),
   with proposed changes marked. */
:root{
  /* Type */
  --app-font-sans: "Soehne", system-ui, sans-serif;
  --text-xs-size: 0.75rem;    /* 12px */
  --text-sm-size: 0.8125rem;  /* 13px */
  --text-base-size: 0.875rem; /* 14px */
  --text-lg-size: 1rem;       /* 16px */
  --text-xl-size: 1.125rem;   /* 18px */
  --text-2xl-size: 1.25rem;   /* 20px */
  --text-3xl-size: 1.5rem;    /* 24px */

  /* Color roles */
  --background: oklch(1 0 0);
  --foreground: oklch(0.245 0.0075 285.8);       /* base-night */
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.245 0.0075 285.8);
  --border: oklch(0.920 0.0006 286.4);           /* grays-300 */
  --muted: oklch(0.960 0 0);                      /* grays-200 */
  --muted-foreground: oklch(0.461 0.0048 286.2); /* proposed: grays-900. Today it is grays-800, which is 4.32:1 on white */
  --secondary: oklch(0.960 0 0);                  /* grays-200 */
  --secondary-hover: oklch(0.920 0.0006 286.4);   /* grays-300 */
  --primary: oklch(0.539 0.2393 268.3);           /* blurple-base, the brand blue */
  --primary-hover: oklch(0.505 0.2196 268.6);     /* blurple-b0 */
  --primary-foreground: oklch(1 0 0);
  --accent-light: oklch(0.952 0.0217 277.5);      /* blurple-a7 */
  --destructive: oklch(0.571 0.2186 27.8);        /* red-base */
  --ring: oklch(0.245 0.0075 285.8);
  --success: oklch(0.526 0.1294 147.2);           /* green-base */
  --success-light: oklch(0.959 0.0267 148.8);     /* green-a7 */

  /* Light palette steps, used for tags (values written out from the palettes) */
  --pink-a7: oklch(0.949 0.0273 0.7);
  --purple-a7: oklch(0.954 0.0241 301.8);
  --blue-a7: oklch(0.952 0.0241 248.1);
  --green-a7: oklch(0.959 0.0267 148.8);

  /* Proposed: there is no radius token today */
  --radius-tag: 5px;     /* most used on tags and ribbons */
  --radius-control: 6px; /* most used on buttons */
  --radius-card: 12px;   /* most used on cards */
}

/* Inter stands in for Soehne */
:root{ --app-font-sans: "Inter", system-ui, sans-serif; }

*{ box-sizing:border-box; }
body{ margin:0; padding:40px; background:var(--muted); font-family:var(--app-font-sans); color:var(--foreground); }

#card{
  width:312px; background:var(--card); border:0.8px solid var(--border);
  border-radius:var(--radius-card); overflow:hidden; display:flex; flex-direction:column;
}
.cover{ position:relative; width:312px; height:180px; background:#e4e9f2; }
.ribbon{
  position:absolute; top:12px; left:12px; padding:4px 8px; border-radius:var(--radius-tag);
  background:var(--destructive); color:var(--primary-foreground);
  font-size:11px; font-weight:500; line-height:16px;
}
.bookmark{
  position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
  border:0; padding:0; display:grid; place-items:center; cursor:pointer;
  background:oklch(0.245 0.0075 285.8 / 0.72); color:var(--primary-foreground);
  transition:background-color .15s ease;
}
.bookmark:hover{ background:oklch(0.245 0.0075 285.8 / 0.88); }
.bookmark:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
.bookmark svg{ width:16px; height:16px; }
.body{ padding:16px; display:flex; flex-direction:column; gap:12px; }
.text{ display:flex; flex-direction:column; gap:4px; }
.title{ margin:0; font-size:var(--text-lg-size); font-weight:700; line-height:1.375; color:var(--foreground); }
.company{ margin:0; font-size:var(--text-base-size); font-weight:500; line-height:1.45; color:var(--muted-foreground); }
.pitch{ margin:0; font-size:var(--text-base-size); font-weight:400; line-height:1.45; color:var(--muted-foreground); }
.raised{ margin:0; font-size:var(--text-base-size); line-height:1.45; color:var(--muted-foreground); font-weight:400; }
.raised strong{ font-weight:700; color:var(--foreground); }
.tags{ display:flex; gap:8px; margin:0; padding:0; list-style:none; }
.tag{
  height:24px; padding:0 8px; display:inline-flex; align-items:center; border-radius:var(--radius-tag);
  font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.02em; color:var(--foreground);
}
.tag.pink{ background:var(--pink-a7); }
.tag.purple{ background:var(--purple-a7); }
</style>
</head>
<body>
<article id="card" aria-label="Plantline deal">
  <div class="cover">
    <span class="ribbon">8 Days Left</span>
    <button class="bookmark" type="button" aria-label="Save Plantline to bookmarks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
    </button>
  </div>
  <div class="body">
    <div class="text">
      <h3 class="title">Hydroponic produce, grown 40 miles from your kitchen</h3>
      <p class="company">Plantline</p>
      <p class="pitch">Fresh greens delivered weekly from indoor farms</p>
    </div>
    <p class="raised"><strong>$212,400 raised</strong> from 318 investors</p>
    <ul class="tags">
      <li class="tag pink">VC-backed</li>
      <li class="tag purple">Fast growth</li>
    </ul>
  </div>
</article>
</body>
</html>
