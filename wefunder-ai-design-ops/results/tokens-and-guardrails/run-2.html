<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantline deal card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Excerpt of Wefunder's existing tokens (names and values from the live stylesheet),
   with proposed changes marked. */
:root{
  /* Type */
  --app-font-sans: "Soehne", system-ui, sans-serif;
  --text-xs-size: 0.75rem;    /* 12px */
  --text-sm-size: 0.8125rem;  /* 13px */
  --text-base-size: 0.875rem; /* 14px */
  --text-lg-size: 1rem;       /* 16px */
  --text-xl-size: 1.125rem;   /* 18px */
  --text-2xl-size: 1.25rem;   /* 20px */
  --text-3xl-size: 1.5rem;    /* 24px */

  /* Color roles */
  --background: oklch(1 0 0);
  --foreground: oklch(0.245 0.0075 285.8);       /* base-night */
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.245 0.0075 285.8);
  --border: oklch(0.920 0.0006 286.4);           /* grays-300 */
  --muted: oklch(0.960 0 0);                      /* grays-200 */
  --muted-foreground: oklch(0.461 0.0048 286.2); /* proposed: grays-900. Today it is grays-800, which is 4.32:1 on white */
  --secondary: oklch(0.960 0 0);                  /* grays-200 */
  --secondary-hover: oklch(0.920 0.0006 286.4);   /* grays-300 */
  --primary: oklch(0.539 0.2393 268.3);           /* blurple-base, the brand blue */
  --primary-hover: oklch(0.505 0.2196 268.6);     /* blurple-b0 */
  --primary-foreground: oklch(1 0 0);
  --accent-light: oklch(0.952 0.0217 277.5);      /* blurple-a7 */
  --destructive: oklch(0.571 0.2186 27.8);        /* red-base */
  --ring: oklch(0.245 0.0075 285.8);
  --success: oklch(0.526 0.1294 147.2);           /* green-base */
  --success-light: oklch(0.959 0.0267 148.8);     /* green-a7 */

  /* Light palette steps, used for tags (values written out from the palettes) */
  --pink-a7: oklch(0.949 0.0273 0.7);
  --purple-a7: oklch(0.954 0.0241 301.8);
  --blue-a7: oklch(0.952 0.0241 248.1);
  --green-a7: oklch(0.959 0.0267 148.8);

  /* Proposed: there is no radius token today */
  --radius-tag: 5px;     /* most used on tags and ribbons */
  --radius-control: 6px; /* most used on buttons */
  --radius-card: 12px;   /* most used on cards */
}


/* Inter stands in for Soehne */
body{
  margin:0;
  padding:2rem;
  background:var(--muted);
  font-family:"Inter", var(--app-font-sans);
  font-size:var(--text-base-size);
  color:var(--foreground);
  -webkit-font-smoothing:antialiased;
}

#card{
  position:relative;
  width:312px;
  box-sizing:border-box;
  background:var(--card);
  color:var(--card-foreground);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  overflow:hidden;
}

.cover{
  position:relative;
  width:312px;
  height:180px;
  margin:-1px -1px 0;
  background:var(--blue-a7); /* stands in for #e4e9f2, see open questions */
}

.ribbon{
  position:absolute;
  top:0.75rem;
  left:0.75rem;
  padding:0.25rem 0.5rem;
  background:var(--destructive);
  color:var(--primary-foreground);
  font-size:var(--text-xs-size);
  font-weight:500;
  line-height:1.25;
  border-radius:var(--radius-tag);
  font-variant-numeric:tabular-nums;
}

.save{
  position:absolute;
  top:0.5rem;
  right:0.5rem;
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  padding:0;
  border:0;
  border-radius:50%;
  background:var(--muted-foreground);
  color:var(--primary-foreground);
  cursor:pointer;
}
.save:hover{ background:var(--foreground); }
.save:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
.save:disabled{ opacity:0.4; cursor:not-allowed; background:var(--muted-foreground); }
.save svg{ width:18px; height:18px; display:block; }

.body{
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:0.25rem;
}

.title{
  margin:0;
  font-size:var(--text-lg-size);
  font-weight:600;
  line-height:1.375;
  color:var(--foreground);
}
.title a{
  color:inherit;
  text-decoration:none;
  border-radius:var(--radius-tag);
}
.title a:hover{ text-decoration:underline; }
.title a:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
.title a[aria-disabled="true"]{ color:var(--muted-foreground); pointer-events:none; text-decoration:none; }

.company{
  margin:0;
  font-size:var(--text-base-size);
  font-weight:500;
  line-height:1.4;
  color:var(--muted-foreground);
}
.pitch{
  margin:0;
  font-size:var(--text-base-size);
  font-weight:400;
  line-height:1.4;
  color:var(--muted-foreground);
}

.raised{
  margin:0.75rem 0 0;
  font-size:var(--text-base-size);
  line-height:1.4;
  font-variant-numeric:tabular-nums;
  color:var(--muted-foreground);
  font-weight:400;
}
.raised strong{ font-weight:600; color:var(--foreground); }

.tags{
  display:flex;
  gap:0.5rem;
  margin:0.75rem 0 0;
  padding:0;
  list-style:none;
}
.tag{
  display:inline-flex;
  align-items:center;
  height:1.5rem;
  padding:0 0.5rem;
  box-sizing:border-box;
  font-size:var(--text-xs-size);
  font-weight:500;
  color:var(--foreground);
  border-radius:var(--radius-tag);
}
.tag--funding{ background:var(--pink-a7); }
.tag--traction{ background:var(--green-a7); }
</style>
</head>
<body>
<article id="card" aria-labelledby="plantline-title">
  <div class="cover" role="img" aria-label="Cover image placeholder">
    <span class="ribbon">Closes in 8 days</span>
    <button class="save" type="button" aria-label="Save Plantline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
    </button>
  </div>
  <div class="body">
    <h3 class="title" id="plantline-title"><a href="#">Hydroponic produce, grown 40 miles from your kitchen</a></h3>
    <p class="company">Plantline</p>
    <p class="pitch">Fresh greens delivered weekly from indoor farms</p>
    <p class="raised"><strong>$212,400 raised</strong> from 318 investors</p>
    <ul class="tags">
      <li class="tag tag--funding">VC-backed</li>
      <li class="tag tag--traction">Fast growth</li>
    </ul>
  </div>
</article>
</body>
</html>
