<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantline deal card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Excerpt of Wefunder's existing tokens (names and values from the live stylesheet),
   with proposed changes marked. */
:root{
  /* Type */
  --app-font-sans: "Soehne", system-ui, sans-serif;
  --text-xs-size: 0.75rem;    /* 12px */
  --text-sm-size: 0.8125rem;  /* 13px */
  --text-base-size: 0.875rem; /* 14px */
  --text-lg-size: 1rem;       /* 16px */
  --text-xl-size: 1.125rem;   /* 18px */
  --text-2xl-size: 1.25rem;   /* 20px */
  --text-3xl-size: 1.5rem;    /* 24px */

  /* Color roles */
  --background: oklch(1 0 0);
  --foreground: oklch(0.245 0.0075 285.8);       /* base-night */
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.245 0.0075 285.8);
  --border: oklch(0.920 0.0006 286.4);           /* grays-300 */
  --muted: oklch(0.960 0 0);                      /* grays-200 */
  --muted-foreground: oklch(0.461 0.0048 286.2); /* proposed: grays-900. Today it is grays-800, which is 4.32:1 on white */
  --secondary: oklch(0.960 0 0);                  /* grays-200 */
  --secondary-hover: oklch(0.920 0.0006 286.4);   /* grays-300 */
  --primary: oklch(0.539 0.2393 268.3);           /* blurple-base, the brand blue */
  --primary-hover: oklch(0.505 0.2196 268.6);     /* blurple-b0 */
  --primary-foreground: oklch(1 0 0);
  --accent-light: oklch(0.952 0.0217 277.5);      /* blurple-a7 */
  --destructive: oklch(0.571 0.2186 27.8);        /* red-base */
  --ring: oklch(0.245 0.0075 285.8);
  --success: oklch(0.526 0.1294 147.2);           /* green-base */
  --success-light: oklch(0.959 0.0267 148.8);     /* green-a7 */

  /* Light palette steps, used for tags (values written out from the palettes) */
  --pink-a7: oklch(0.949 0.0273 0.7);
  --purple-a7: oklch(0.954 0.0241 301.8);
  --blue-a7: oklch(0.952 0.0241 248.1);
  --green-a7: oklch(0.959 0.0267 148.8);

  /* Proposed: there is no radius token today */
  --radius-tag: 5px;     /* most used on tags and ribbons */
  --radius-control: 6px; /* most used on buttons */
  --radius-card: 12px;   /* most used on cards */
}

/* Page */
*{box-sizing:border-box}
body{
  margin:0;
  padding:48px;
  background:var(--muted);
  font-family:Inter, var(--app-font-sans); /* Inter stands in for Soehne */
  color:var(--foreground);
  -webkit-font-smoothing:antialiased;
}

/* Card */
#card{
  width:312px;
  background:var(--card);
  border:0.8px solid var(--border);
  border-radius:var(--radius-card);
  overflow:hidden;
}
.cover{
  position:relative;
  width:312px;
  height:180px;
  background:#e4e9f2;
  border-radius:8px 8px 0 0;
}
.ribbon{
  position:absolute;
  top:12px;
  left:12px;
  padding:4px 8px;
  background:var(--destructive); /* red-base: stronger contrast with white text than #eb503f */
  color:var(--primary-foreground);
  font-size:var(--text-xs-size);
  font-weight:500;
  line-height:16px;
  border-radius:var(--radius-tag);
}
.bookmark{
  position:absolute;
  top:12px;
  right:12px;
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:50%;
  background:#8b8b8b;
  color:#fff;
  cursor:pointer;
  transition:background-color .15s ease;
}
.bookmark:hover{background:#6f6f6f}
.bookmark:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

.body{padding:16px}
.title{
  margin:0;
  font-size:var(--text-lg-size);
  font-weight:700;
  line-height:1.3;
  color:var(--foreground);
}
.company{
  margin:6px 0 0;
  font-size:var(--text-base-size);
  font-weight:500;
  line-height:20px;
  color:var(--muted-foreground);
}
.pitch{
  margin:2px 0 0;
  font-size:var(--text-base-size);
  font-weight:400;
  line-height:20px;
  color:var(--muted-foreground);
}
.raised{
  margin:14px 0 0;
  font-size:var(--text-base-size);
  line-height:20px;
  color:var(--muted-foreground);
}
.raised strong{font-weight:700;color:var(--foreground)}
.tags{
  display:flex;
  gap:8px;
  margin:14px 0 0;
  padding:0;
  list-style:none;
}
.tag{
  display:inline-flex;
  align-items:center;
  height:24px;
  padding:0 8px;
  border-radius:var(--radius-tag);
  font-size:var(--text-xs-size);
  font-weight:500;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--foreground);
}
.tag--pink{background:var(--pink-a7)}
.tag--purple{background:var(--purple-a7)}
</style>
</head>
<body>
<article id="card" aria-labelledby="plantline-title">
  <div class="cover">
    <span class="ribbon">Closes in 8 days</span>
    <button class="bookmark" type="button" aria-label="Save Plantline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
    </button>
  </div>
  <div class="body">
    <h3 class="title" id="plantline-title">Hydroponic produce, grown 40 miles from your kitchen</h3>
    <p class="company">Plantline</p>
    <p class="pitch">Fresh greens delivered weekly from indoor farms</p>
    <p class="raised"><strong>$212,400 raised</strong> from 318 investors</p>
    <ul class="tags">
      <li class="tag tag--pink">VC-backed</li>
      <li class="tag tag--purple">Fast growth</li>
    </ul>
  </div>
</article>
</body>
</html>
